<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CUI Lahore Timetable Planner</title>
<meta name="description" content="Search every CUI Lahore section, teacher, room and time in one place, build a clash-free week, and find swaps. Reconstructed from the university's public timetable." />
<!-- Everything this page loads is same-origin and self-authored: no CDN scripts, no
     third-party fonts, no inline <script> or onclick= handlers anywhere. That means
     script-src can be locked to 'self' with zero exceptions - any script an attacker
     might ever manage to inject (were an XSS bug to exist) is blocked outright,
     regardless of where it came from. -->
<!-- frame-ancestors is deliberately omitted: it's an HTTP-header-only directive per
     spec and browsers ignore (and warn about) it in a <meta> tag. GitHub Pages gives
     no way to set custom response headers, so clickjacking protection isn't available
     to a static site hosted here - noted rather than shipping a directive that lies
     about being enforced. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://dxorvodovxlhuoducnrl.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none';" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<!-- PWA: installable, works offline once visited once (see sw.js). Icon and
     theme-color match the header's brand mark (ink, matching the header mark) exactly. -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#111110" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="CUI Timetable" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111110'/%3E%3Ctext x='50' y='66' font-size='40' font-family='system-ui' font-weight='800' fill='white' text-anchor='middle'%3ECU%3C/text%3E%3C/svg%3E" />
<link href="styles.css" rel="stylesheet" />
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" title="CUI Lahore Timetable Planner">
        <span class="brand-mark">CU</span>
        <span class="brand-text">
          <span class="brand-title">CUI Lahore</span>
          <span class="brand-sub">Timetable Planner</span>
        </span>
      </a>

      <nav class="nav">
        <a href="#/courses" data-section="course">Courses</a>
        <a href="#/teachers" data-section="teacher">Faculty</a>
        <a href="#/sections" data-section="section">Sections</a>
        <a href="#/rooms" data-section="room">Rooms</a>
        <a href="#/autobuild" data-section="autobuild">Auto-build</a>
        <a href="#/swaps" data-section="swaps">Swaps</a>
        <a href="#/planner" data-section="planner">Planner <span id="nav-plan-count" class="tag accent" style="margin-left:4px;"></span></a>
      </nav>

      <div class="searchbox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search-input" type="text" placeholder="Search a course, teacher, section, or room…" autocomplete="off" spellcheck="false" />
        <kbd>/</kbd>
        <div id="search-results" class="search-results hidden"></div>
      </div>

      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </div>
  </header>

  <main class="main" id="view"></main>


  <nav class="tabbar" aria-label="Primary">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span>Home</span>
    </a>
    <a href="#/find" data-tab="find">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span>Find</span>
    </a>
    <a href="#/rooms" data-tab="room">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4.5A1.5 1.5 0 0 1 5.5 3h9A1.5 1.5 0 0 1 16 4.5V21"/><path d="M16 9h3.5A1.5 1.5 0 0 1 21 10.5V21"/><path d="M2.5 21h19"/><circle cx="12.5" cy="12.5" r="1"/></svg>
      <span>Rooms</span>
    </a>
    <a href="#/planner" data-tab="planner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
      <span>Plan</span>
      <span id="tab-plan-count" class="tab-badge"></span>
    </a>
    <a href="#/swaps" data-tab="swaps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.5-3.5"/><path d="M20 16H7l3.5 3.5"/></svg>
      <span>Swaps</span>
    </a>
  </nav>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-freshness">
        <span id="footer-meta">Loading timetable data…</span>
        <button id="refresh-data" class="btn sm" type="button" title="Fetch the latest published timetable, ignoring any cached copy">Check for updates</button>
      </span>
      <span>Built by a student from the <a href="https://sfs.cuilahore.edu.pk/schedule/Public/Timetable" target="_blank" rel="noopener noreferrer">published timetable</a>, not an official university page · <a href="https://github.com/umair363/cui-lahore-timetable-planner" target="_blank" rel="noopener noreferrer">Source</a></span>
    </div>
  </footer>
</div>

<script src="app-data.js"></script>
<script src="app-grid.js"></script>
<script src="app-plan.js"></script>
<script src="app-swap.js"></script>
<script src="app-supabase.js"></script>
<script src="app-views.js"></script>
<script src="app-planner-views.js"></script>
<script src="app-swap-views.js"></script>
<script src="app.js"></script>
</body>
</html>
